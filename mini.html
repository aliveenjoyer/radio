<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Encore FM — мини-плеер</title>
<!-- Мини-плеер для встраивания (в «Лобби»): тот же эфир с той же секунды, что на radio.aliveenjoyer.art. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://www.youtube.com https://s.ytimg.com https://w.soundcloud.com; frame-src https://www.youtube.com https://www.youtube-nocookie.com https://w.soundcloud.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://173-249-26-11.sslip.io:8444; object-src 'none'; base-uri 'none'; form-action 'none'">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400..650&family=Geist+Mono:wght@500..650&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css?v=20261123075031">
<link rel="stylesheet" href="css/mini.css?v=20261123075031">
</head>
<body class="mini off">
<div class="m-screen screen" id="screen">
  <div class="screen-media" id="media"></div>
  <div class="screen-tune" id="screen-tune" aria-hidden="true">
    <canvas class="screen-noise" id="noise" width="120" height="68"></canvas>
    <div class="screen-ident"><b>Encore<i>FM</i></b><span id="tune-text">Поиск волны…</span></div>
  </div>
  <div class="screen-off" id="screen-off">
    <div class="screen-art" id="screen-art"></div>
    <button class="power-cta" id="power-cta" type="button"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="currentColor" d="M8 5.5v13a1 1 0 0 0 1.5.9l10.4-6.5a1 1 0 0 0 0-1.8L9.5 4.6A1 1 0 0 0 8 5.5Z"/></svg><span>Слушать эфир</span></button>
  </div>
</div>
<p class="m-tap hide" id="tap-hint"><b>Нажми ▶ на клипе</b> — браузер просит одно касание</p>
<div class="m-vfd" id="vfd">
  <div class="m-row"><span id="vfd-mode">● ЭФИР</span><span id="m-crowd"></span></div>
  <div class="m-title"><div class="m-run" id="vfd-title">ENCORE FM</div></div>
  <div class="m-row m-sub"><span id="vfd-artist">РАДИО ALIVEENJOYER</span><span id="vfd-by"></span></div>
  <div class="m-row m-prog"><span class="vfd-bars" id="vfd-bars"></span><span class="vfd-time" id="vfd-time">--:--</span></div>
</div>
<div class="m-bar">
  <button class="m-btn" id="power" type="button" aria-pressed="false" title="Вкл / выкл"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M11 3h2v9h-2zm6.4 2.6 1.4 1.4A8 8 0 1 1 5.2 7l1.4-1.4A6 6 0 1 0 17.4 5.6Z"/></svg></button>
  <label class="m-vol"><svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path fill="currentColor" d="M4 9v6h4l5 4V5L8 9H4Zm12.5 3a4.5 4.5 0 0 0-2.5-4v8a4.5 4.5 0 0 0 2.5-4Z"/></svg><input type="range" id="vol" min="0" max="100" step="1" aria-label="Громкость"></label>
  <a class="m-order" href="https://radio.aliveenjoyer.art/" target="_blank" rel="noopener">Заказать трек ↗</a>
</div>
<script type="module" src="js/mini.js?v=20261123075031"></script>
</body>
</html>
